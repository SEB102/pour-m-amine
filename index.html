<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pour M. Amine</title>
<style>
  :root { --bg:#0e1120; --panel:#171b30; --line:#2a3050; --text:#e8ebf7; --muted:#8d94b3;
          --R:#ff9a2e; --L:#3b9cff; --accent:#5b7cff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text);
              font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:8px 12px; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; }
  .grp { display:flex; align-items:center; gap:8px; }
  button, .btn { background:#252b4a; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 13px;
                 font:inherit; cursor:pointer; white-space:nowrap; }
  button:hover, .btn:hover { background:#2f3760; }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); font-weight:600; }
  button.primary:hover { background:#6f8bff; }
  input[type=file] { display:none; }
  input[type=range] { accent-color:var(--accent); }
  input[type=number] { width:4.8em; background:#252b4a; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit; font-variant-numeric:tabular-nums; }
  select { background:#252b4a; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit; }
  label { color:var(--muted); }
  #speed { width:190px; }
  #speedVal { display:inline-block; min-width:3.4em; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:5px; }
  .legend { color:var(--muted); font-size:13px; }
  #title { font-weight:600; max-width:34ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #status { color:var(--muted); font-size:13px; margin-left:auto; }
  #status.err { color:#ff7b7b; }
  #progwrap { flex:1; min-width:160px; position:relative; display:flex; }
  #progress { flex:1; min-width:160px; }
  #mbubble { position:absolute; top:calc(100% + 3px); transform:translateX(-50%); background:var(--accent); color:#fff; font-size:12px; font-weight:700; padding:2px 9px; border-radius:8px; white-space:nowrap; pointer-events:none; z-index:7; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  #mbubble[hidden] { display:none; }
  header { position:relative; z-index:6; }
  #info { color:var(--muted); font-variant-numeric:tabular-nums; min-width:21ch; text-align:right; }
  .tip { position:relative; }
  .tiptext { display:none; position:absolute; top:calc(100% + 8px); left:0; width:max-content; max-width:min(520px, 90vw); z-index:20;
             background:#0b0e1c; color:var(--text); border:1px solid var(--accent); border-radius:8px; padding:8px 12px; font-size:13px; line-height:1.4;
             box-shadow:0 6px 20px rgba(0,0,0,.5); pointer-events:none; }
  .tip:hover .tiptext, .tip:focus-within .tiptext { display:block; }
  footer { background:var(--panel); border-top:1px solid var(--line); text-align:center; color:var(--muted); font-size:12px; letter-spacing:.12em; padding:6px 12px; }
  footer a { color:#a9b6ff; text-decoration:underline; text-underline-offset:3px; }
  footer a:hover { color:#fff; }
  main { flex:1; min-height:0; position:relative; }
  #bar { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; }
  #bar button { padding:5px 10px; }
  #bar .grp { gap:5px; }
  #bar .lab { color:var(--muted); font-size:12px; }
  #bInfo { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  #bar .sepv { width:1px; height:22px; background:var(--line); }
  #panel[hidden] { display:none; }
  #panel { display:flex; flex-direction:column; gap:8px; padding-top:6px; border-top:1px solid var(--line); }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #fpop { position:absolute; z-index:6; display:none; align-items:center; gap:5px; background:#0b0e1c; border:1px solid var(--accent); border-radius:10px; padding:6px 8px; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  #fpop .sep { width:1px; align-self:stretch; background:var(--line); margin:0 3px; }
  #fpop button { padding:4px 10px; min-width:30px; }
  #gpop { position:absolute; z-index:6; display:none; align-items:center; gap:8px; background:#0b0e1c; border:1px solid var(--accent); border-radius:10px; padding:6px 10px; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  #gpop .sep { width:1px; align-self:stretch; background:var(--line); }
  #gpop button { padding:4px 12px; }
  #fpop #nums { display:none; gap:5px; } #fpop #nums2 { display:flex; gap:3px; } #fpop .sublab { font-size:12px; color:var(--muted,#8d94b3); }
  label.chk { display:inline-flex; align-items:center; gap:4px; font-size:13px; cursor:pointer; }
  #fpop #rake { display:flex; line-height:0; } #fpop .fk { cursor:pointer; } #fpop .fk:hover circle { stroke:#fff; }
  #fpop button.on { background:var(--accent); border-color:var(--accent); font-weight:700; }
  .seg { display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#1e2340; }
  .seg .seglab { padding:0 8px; color:var(--muted); }
  .seg button { border:0; border-left:1px solid var(--line); border-radius:0; background:transparent; padding:7px 11px; }
  .seg button.pressed { background:var(--accent); font-weight:600; }
  button.pressed { background:var(--accent); border-color:var(--accent); }
  #drop { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(91,124,255,.25);
          border:3px dashed var(--accent); font-size:22px; z-index:5; pointer-events:none; }
  body.dragging #drop { display:flex; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="view3d.js?v=20261016c"></script>
<script src="core.js?v=20261010d"></script>

<script src="hands_legacy.js?v=20261010g"></script>
</head>
<body>
<header>
  <div id="bar">
    <div class="grp">
      <button id="bRew" title="Retour au début (Début)">⏮</button>
      <button id="bPlay" class="primary" title="Lecture / pause (Espace)">▶ Lecture</button>
    </div>
    <div class="sepv"></div>
    <div class="grp"><span class="lab">Vitesse</span><input type="range" id="bSld" min="0.25" max="1" step="0.05" title="Vitesse (curseur) : 1× = tempo de la partition" style="width:150px"><span id="bSpd" class="lab"></span></div>
    <div class="sepv"></div>
    <div class="grp"><label for="tempo" class="lab">Tempo ♩ =</label>
      <input id="tempo" type="number" min="20" max="300" step="1" disabled title="Tempo de départ (noires par minute). Par défaut : celui de la partition ; modifiable.">
      <button id="tempoReset" title="Revenir au tempo de la partition">↺</button></div>
    <div class="sepv"></div>
    <div class="grp"><span class="lab">Main</span>
      <button id="bhL" title="Afficher / masquer la main gauche">M.G.</button><button id="bhR" title="Afficher / masquer la main droite">M.D.</button></div>
    <div class="sepv"></div>
    <div class="grp"><label for="vis" class="lab">Mesures visibles</label><select id="vis"><option selected>1</option><option>2</option></select></div>
    <div class="sepv"></div>
    <div class="grp"><button id="bM0" title="Masquer ou afficher les mains virtuelles">supprimer mains virtuelles</button> <button id="b3d" title="Vue 3D : clavier en perspective, rouleau qui s'éloigne, mains en traits épais ; glisser pour tourner, molette pour zoomer, double-clic pour revenir (V)">vue 3D</button></div>
    <span id="bInfo"></span><span id="status"></span>
  </div>
  <div class="row">
    <span id="title">Aucun morceau</span>
    <span id="progwrap"><input id="progress" title="Curseur de position : faire glisser pour rembobiner ou avancer ; la bulle donne le numéro de mesure" type="range" min="0" max="1" step="0.001" value="0" disabled><span id="mbubble" hidden></span></span>
    <span id="info">—</span>
    <span class="legend" title="Orange = main droite, bleu = main gauche"><span class="sw" style="background:var(--L)"></span>M.G.
      <span class="sw" style="background:var(--R);margin-left:10px"></span>M.D.</span>
    <button id="fs" title="Afficher toute l'application en plein écran (Échap pour quitter)">⛶ Plein écran</button>
  </div>
</header>
<main>
  <canvas id="cv"></canvas>
  <div id="gpop"><span id="gcount"></span><span class="sep"></span><button data-gh="R" title="Affecter ces notes à la main droite">M.D.</button><button data-gh="L" title="Affecter ces notes à la main gauche">M.G.</button><button id="gcancel" title="Annuler la sélection (Échap)">✕</button></div>
  <div id="fpop"><button data-h="R" title="Main droite (touche D)">M.D.</button><button data-h="L" title="Main gauche (touche G)">M.G.</button><span class="sep"></span><span id="rake"></span><span id="nums"><button data-f="1">1</button><button data-f="2">2</button><button data-f="3">3</button><button data-f="4">4</button><button data-f="5">5</button></span><button data-f="0" title="Effacer le doigté">✕</button><span class="sep"></span><span class="sublab" title="Changement de doigt sur la touche tenue : le doigt de départ est remplacé par celui-ci en cours de note">puis</span><span id="nums2"><button data-s="1">1</button><button data-s="2">2</button><button data-s="3">3</button><button data-s="4">4</button><button data-s="5">5</button></span><button data-s="0" title="Pas de changement de doigt">✕</button></div>
</main>

  const ww = W / VIEW.n, bh = kbH * 0.62;
  ctx.fillStyle = '#05060d'; ctx.fillRect(0, top, W, kbH);
  for (let m = FIRST; m <= LAST; m++) {
    if (isBlack(m)) continue;
    const r = keyRect(m, W), an = active.get(m), hand = an && noteHand(an);
    const gr = ctx.createLinearGradient(0, top, 0, top + kbH);
    if (hand) { gr.addColorStop(0, COL[hand].key); gr.addColorStop(1, COL[hand].lit); } else { gr.addColorStop(0, '#f7f7f9'); gr.addColorStop(1, '#d9dbe3'); }
    ctx.fillStyle = gr; rrect(r.x + .5, top + 2, r.w - 1, kbH - 3, 3); ctx.fill();
    if (m % 12 === 0 && ww >= 17) {
      ctx.fillStyle = hand ? '#1b1b2a' : '#6a6f88'; ctx.font = '600 11px -apple-system, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('Do' + (Math.floor(m / 12) - 1), r.x + r.w / 2, top + kbH - 9);
    }
  }
  for (let m = FIRST; m <= LAST; m++) {
    if (!isBlack(m)) continue;
    const r = keyRect(m, W), an = active.get(m), hand = an && noteHand(an);
    ctx.fillStyle = hand ? COL[hand].keyB : '#15161f';
    rrect(r.x, top + 2, r.w, bh, 3); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(0, top, W, 2);
}

// ---------- Export vidéo (enregistrement en temps réel : image + son) ----------
const exp = { active: false, started: false, rec: null, chunks: [], canvas: null, ctx: null, W: 1280, H: 720, scale: 1, endAt: 0, cleanup: null, cancelled: false, mime: '' };
function pickMime() {
  if (!window.MediaRecorder) return '';
  return ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
}
async function startExport() {
  if (!song || exp.active) return;
  clearError();
  if (speed <= 0) return showError('Export impossible à la vitesse 0.');
  const mime = pickMime(); if (!mime) return showError('Ce navigateur ne sait pas enregistrer de vidéo (essayez Chrome).');
  if (sampler && !samplerReady) return showError('Attendez la fin du chargement du piano avant d\'exporter.');
  pause(); seek(startPos());
  try { if (typeof Tone !== 'undefined') await Tone.start(); } catch (e) {}
  if (playing) return;   // pendant l'attente du son (Safari : parfois longue), une autre lecture a pu démarrer
  let audioStream;
  if (sampler && samplerReady) {
    const d = Tone.getContext().createMediaStreamDestination(); Tone.getDestination().connect(d);
    audioStream = d.stream; exp.cleanup = () => { try { Tone.getDestination().disconnect(d); } catch (e) {} };
  } else {
    synthFallback.ensure(); const d = synthFallback.ctx.createMediaStreamDestination(); synthFallback.tap = d;
    audioStream = d.stream; exp.cleanup = () => { synthFallback.tap = null; };
  }
  const outW = parseInt($('xres').value, 10);
  exp.W = 1280; exp.H = 720; exp.scale = outW / 1280;
  exp.canvas = document.createElement('canvas'); exp.canvas.width = outW; exp.canvas.height = Math.round((720 + BAND) * exp.scale);
  exp.ctx = exp.canvas.getContext('2d');
  exp.mime = mime; exp.chunks = []; exp.cancelled = false; exp.started = false; exp.active = true;
  draw(); // 1re image avant le début de la capture
  const stream = new MediaStream([...exp.canvas.captureStream(30).getVideoTracks(), ...audioStream.getAudioTracks()]);
  exp.rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: outW >= 1920 ? 12e6 : 6e6 });
  exp.rec.ondataavailable = e => { if (e.data && e.data.size) exp.chunks.push(e.data); };
  exp.rec.onstop = finishExport;
  exp.rec.start(1000);
  refreshButtons();
  await play(); exp.started = true;
}
function exportTick(ts) {
  const pct = song.durationSec ? Math.max(0, Math.min(100, Math.round(100 * (pos - startPos()) / (song.durationSec - startPos())))) : 100;
  $('status').dataset.exp = 'Export vidéo en cours… ' + pct + ' % (gardez cet onglet visible)'; refreshStatus();
  if (!playing) { // fin du morceau : on laisse décroître la dernière note
    if (!exp.endAt) exp.endAt = ts + 1800;
    else if (ts >= exp.endAt) stopExport(false);
  }
}
function stopExport(cancel) {
  if (!exp.active || !exp.rec || exp.rec.state === 'inactive') return;
  exp.cancelled = cancel; pause(); exp.rec.stop();
}
function finishExport() {
  const type = exp.mime.split(';')[0], ext = type === 'video/mp4' ? 'mp4' : 'webm';
  if (exp.cleanup) exp.cleanup();
  const wasCancelled = exp.cancelled, chunks = exp.chunks;
  exp.active = false; exp.started = false; exp.endAt = 0; exp.rec = null; exp.chunks = [];
  delete $('status').dataset.exp;
  seek(startPos()); refreshButtons();
  if (wasCancelled) { refreshStatus(); return; }
  const blob = new Blob(chunks, { type }), name = (song.title || 'piano-roll').replace(/[\\/:*?"<>|]+/g, '_') + '.' + ext;
  stats.lastExport = { size: blob.size, type, name, blob };
  if (!window.__noDownload) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  $('status').dataset.exp = 'Vidéo enregistrée : ' + name + ' (' + (blob.size / 1048576).toFixed(1) + ' Mo)'; refreshStatus();
  setTimeout(() => { delete $('status').dataset.exp; refreshStatus(); }, 8000);
}
$('export').onclick = () => (exp.active ? stopExport(true) : startExport());

// ---------- Plein écran (toute la page : barre de réglages, rouleau, clavier, bandeau) ----------
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;
const fsOk = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
function refreshFs() { $('fs').textContent = fsEl() ? '⛶ Quitter le plein écran' : '⛶ Plein écran'; }
if (!fsOk) $('fs').style.display = 'none'; // ex. iPhone : pas d'API plein écran pour une page web
$('fs').onclick = async () => {
  try {
    if (fsEl()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else await (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
  } catch (e) { showError('Plein écran refusé par le navigateur.'); }
};
document.addEventListener('fullscreenchange', refreshFs); document.addEventListener('webkitfullscreenchange', refreshFs);

// ---------- Boucle ----------
let drawErrShown = false;
function reportDrawError(err) { console.error(err); if (!drawErrShown) { drawErrShown = true; try { showError('Erreur d\u2019affichage : ' + (err && err.message || err)); } catch (e) {} } }
function frame(ts) {
  const frameT0 = performance.now();
  const dt = Math.min(0.25, (ts - lastTs) / 1000); lastTs = ts;
  { const target = (playing && !exp.active) ? audioLatency() + syncMs / 1000 : 0; vlag += (target - vlag) * Math.min(1, dt * 10); }
  if (playing && song) {
    pos += dt * speed;
    countClicks(); previewTick();
    while (speed > 0 && nextIdx < song.notes.length && song.notes[nextIdx].t0 <= pos) playNote(song.notes[nextIdx++]);
    const END = song.durationSec + BUBBLE_MIN + BURST_SEC; // on laisse finir la dernière bulle (sinon elle reste figée au début de son éclatement)
    if (pos >= END) { pos = END; playing = false; refreshButtons(); }
  }
  if (exp.active && exp.started) exportTick(ts);
  try { updateZoom(dt); } catch (err) { reportDrawError(err); }
  try { draw(); } catch (err) { reportDrawError(err); }
  try { render3D(); } catch (err) { reportDrawError(err); }
  { const d = performance.now() - frameT0; if (d > 250) { slowN++; slowLast = Math.round(d); } }   // images très lentes : comptées et affichées dans la barre // une erreur de dessin ne doit JAMAIS arrêter la boucle (donc le son : les notes sont déclenchées plus haut)
  requestAnimationFrame(frame);
}

// ---------- Barre de commandes (décomposition) ----------
addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b) b.blur(); });
// Mains virtuelles, trois états : aucune / avec trajectoires (doigts repliés, repères, chemins) / sans trajectoires (doigts tendus, ni repères ni chemins)
function setHandsMode(m) { handsMode = m; showHands = m !== 'off';
  showTraj = curlFingers = m === 'traj'; markPlan(); }
function cycleHandsMode() { setHandsMode(handsMode === 'traj' ? 'plain' : handsMode === 'plain' ? 'off' : 'traj'); }
// ---------- Vue 3D : clavier en perspective, rouleau qui s'éloigne, mains en traits épais (glisser pour tourner, molette pour zoomer, double-clic pour revenir) ----------
let view3dOn = false;
function toggle3D() {
  if (typeof THREE === 'undefined' || typeof View3D === 'undefined') { showError('Vue 3D indisponible : la bibliothèque Three.js n\'a pas pu être chargée (connexion ?).'); return; }
  if (!View3D.el()) View3D.init($('cv').parentElement);
  view3dOn = !view3dOn; View3D.show(view3dOn); $('b3d').classList.toggle('pressed', view3dOn);
}
// repères temporels du rouleau 3D : barres de mesure (avec numéro) et temps, entre sp et sp + secondes
function grid3d(sp, ahead) {
  const out = [], T = song.timeline, mi = measureIndexAt(T.secToTick(Math.max(0, sp)));
  for (let i = Math.max(0, mi - 0); i < song.measures.length; i++) {
    const m = song.measures[i], t0 = T.tickToSec(m.startTick); if (t0 > sp + ahead) break;
    const beat = song.ppq * 4 / m.den; if (t0 >= sp) out.push({ t: t0, bar: true, label: m.label });
    for (let t = m.startTick + beat; t < m.startTick + m.lenTick - 1; t += beat) { const ts = T.tickToSec(t); if (ts >= sp && ts <= sp + ahead) out.push({ t: ts }); }
  }
  return out;
}
function render3D() {
  if (!view3dOn || !song) return;
  ensurePlan();
  View3D.render({ song, sp: pos - vlag * speed, plan: song.plan, vis: visibleHands(), noteHand, lowerBoundSec, ux: PianoHands.ux, isBlack: PianoHands.isBlack, fof, fing: showFing, grid: grid3d(pos - vlag * speed, 3.6) });
}
function toggleRoll() { rollVisible = !rollVisible; }
function togglePanel() { panelOpen = !panelOpen; $('panel').hidden = !panelOpen; }
// Texte réécrit seulement s'il change : remplacer le contenu d'un bouton à chaque image peut faire perdre le clic (Safari)
const setT = (e, t) => { if (e.textContent !== t) e.textContent = t; };
function refreshBar() {
  ['bM0', 'vis'].forEach(id => { const b = $(id); if (b && b.disabled !== view3dOn) b.disabled = view3dOn; });   // grisés en vue 3D (mains virtuelles et mesures visibles sans effet)
  const on = (id, v) => $(id).classList.toggle('pressed', !!v);
  on('bPre', preListen); on('bCount', countIn); setT($('bM0'), handsMode === 'off' ? 'afficher mains virtuelles' : 'supprimer mains virtuelles'); on('bAnt', anticip); on('bM0', handsMode === 'off');
  on('bZoom', zoomAuto); on('bRoll', rollVisible); on('bPanel', panelOpen); on('bKeep', keepOther); on('bhL', showL); on('bhR', showR);
  [['bs25', 0.25], ['bs50', 0.5], ['bs75', 0.75], ['bs100', 1]].forEach(([id, v]) => on(id, Math.abs(speed - v) < 1e-9));
  setT($('bPlay'), playing ? '⏸ Pause' : '▶ Lecture'); on('bPlay', playing);
  setT($('bSpd'), '×' + speed.toFixed(2).replace('.', ','));
  ['bRew', 'bPlay'].forEach(id => { $(id).disabled = !song || exp.active; });
  setT($('bInfo'), slowN ? 'images lentes : ' + slowN + ' (dernière : ' + (slowLast / 1000).toFixed(1).replace('.', ',') + ' s)' : '');
}
$('bRew').onclick = rewind;
$('bPlay').onclick = () => { unlockAudio(); if (playing) pause(); else play(); };
$('bSld').oninput = () => setSpeed(+$('bSld').value);
$('bhL').onclick = () => { showL = !showL; }; $('bhR').onclick = () => { showR = !showR; };
$('b3d').onclick = toggle3D; $('bM0').onclick = () => setHandsMode(handsMode === 'off' ? 'plain' : 'off');

// ---------- Démarrage ----------
setSpeed(1); refreshFingButton(); refreshButtons(); initSampler(); openExemple(PARTITION_B64, 'Grille cool de Dorian');   // l'unique partition est chargée au démarrage
requestAnimationFrame(ts => { lastTs = ts; frame(ts); });
// accès pour les tests automatiques
window.__app = { stats, get song() { return song; }, get pos() { return pos; }, get playing() { return playing; }, get speed() { return speed; } };
</script>
</body>
